<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Franpos Fuse Full Page (n-testing)</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .hint {
        padding: 1rem 25px 0;
        font-size: 0.875rem;
        color: #444;
      }
      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 16px 25px 25px;
        box-sizing: border-box;
      }
      #fundbox-fuse-button {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
      }
      #fundbox-fuse-button iframe#fundbox-fuse-button-iframe {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border: 0;
      }
    </style>
  </head>
  <body>
    <p class="hint">Click the Fundbox widget below to open Fuse (n-testing RDE, button API).</p>
    <div class="dashboard">
      <div
        id="fundbox-fuse-button"
        data-fundbox-id="9G1XC3BWNW"
      ></div>
    </div>

    <script>
      var DEFAULT_PARTNER_ID = '9G1XC3BWNW'

      function param(name, fallback) {
        var q = new URLSearchParams(window.location.search)
        var v = q.get(name)
        return v != null && String(v).trim() !== '' ? String(v).trim() : fallback
      }

      var fuseButton = document.querySelector('#fundbox-fuse-button')
      var partnerId = param('fuse_partner_id', param('partnerId', DEFAULT_PARTNER_ID))
      fuseButton.setAttribute('data-fundbox-id', partnerId)

      var authToken = param('auth_token', '')
      if (authToken) fuseButton.setAttribute('data-fundbox-auth-token', authToken)

      var partnerUserId = param('partner_user_id', param('partnerUserId', ''))
      if (partnerUserId) fuseButton.setAttribute('data-fundbox-partner-user-id', partnerUserId)

      var fbxForce = param('fbxForce', param('fbx_force', ''))
      if (fbxForce === 'react' || fbxForce === 'legacy') {
        fuseButton.setAttribute('data-fundbox-fbx-force', fbxForce)
      }
    </script>
    <script src="https://app-n-testing.fbx.im/static/dist/fuse/v1/fuse.js"></script>
    <!-- <script src="https://app-n-webiz-rde.fbx.im/static/dist/fuse/v1/fuse.js"></script> -->
  </body>
</html>
