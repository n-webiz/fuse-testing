<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Franpos Fuse Full Page (React local)</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .dashboard {
        display: flex;
        height: 100%;
      }
      #fundbox-app-wrapper {
        border: 1px solid gray;
        margin: 25px;
        width: 90%;
        height: 100vh;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div
        id="fundbox-app-wrapper"
        data-fundbox-id="2UPE4IM4Q5"
        data-fundbox-partner-user-id=""
      ></div>
    </div>

    <script>
      function onFuseAPIReady() {
        window.FbxFuseClient = new FbxFuse('2UPE4IM4Q5', {
          container: document.querySelector('#fundbox-app-wrapper'),
          events: {
            onStateReady: function (e) {
              console.log('Fundbox State Ready', e)
              window.FbxFuseClient.open({})
            },
            onStateChange: function (e) {
              console.log('Fundbox State Changed', e)
            },
          },
        })
      }
    </script>
    <!-- React local stack: see index.html ?stack=react-local and FUSE_LEGACY_LOCAL_DEV.md -->
    <script src="https://app-local.fbx.im:4505/static/dist/fuse/v1/fuse.js?domain=localhost:3000"></script>
  </body>
</html>
