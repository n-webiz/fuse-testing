<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fuse partner — GitHub Pages host</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .meta {
        flex-shrink: 0;
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }
      .meta code {
        font-size: 0.75rem;
      }
      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #fundbox-app-wrapper {
        border: 1px solid gray;
        margin: 16px;
        width: calc(100% - 32px);
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <p class="meta" id="meta"></p>
    <div class="dashboard">
      <div id="fundbox-app-wrapper"></div>
    </div>

    <script>
      /**
       * Fuse partner test page (GitHub Pages or Live Server) — research RDE only.
       *
       *   app-n-testing.fbx.im/static/dist/fuse/v1/fuse.js?domain=n-testing.fbx.im
       *
       * Query params (optional):
       *   fuse_partner_id, auth_token, partner_user_id, name
       *   host / domain         embed host (default n-testing.fbx.im)
       *   fuseScriptOrigin      fuse.js origin (default https://app-n-testing.fbx.im)
       *   fbxForce=react|legacy edge router hint on fuse_app
       */
      var RESEARCH = {
        embedHost: 'n-testing.fbx.im',
        fuseScriptOrigin: 'https://app-n-testing.fbx.im',
      }

      var DEFAULTS = {
        partnerId: 'WCAQEWAT6K',
        partnerName: 'franpos',
      }

      function param(name, fallback) {
        var q = new URLSearchParams(window.location.search)
        var v = q.get(name)
        return v != null && String(v).trim() !== '' ? String(v).trim() : fallback
      }

      function normalizeAppHost(raw) {
        return String(raw || '')
          .trim()
          .replace(/^https?:\/\//i, '')
          .replace(/\/+$/, '')
      }

      function ensureHttpsOrigin(raw) {
        var trimmed = String(raw || '').trim().replace(/\/+$/, '')
        if (/^https?:\/\//i.test(trimmed)) return trimmed
        return 'https://' + normalizeAppHost(trimmed)
      }

      var partnerId = param('fuse_partner_id', param('partnerId', DEFAULTS.partnerId))
      var embedHost = normalizeAppHost(param('host', param('domain', RESEARCH.embedHost)))
      var fuseScriptOrigin = ensureHttpsOrigin(
        param('fuseScriptOrigin', RESEARCH.fuseScriptOrigin),
      )
      var authToken = param('auth_token', '')
      var partnerUserId = param('partner_user_id', param('partnerUserId', ''))
      var fbxForce = param('fbxForce', param('fbx_force', ''))

      var wrapper = document.querySelector('#fundbox-app-wrapper')
      wrapper.setAttribute('data-fundbox-id', partnerId)
      if (authToken) wrapper.setAttribute('data-fundbox-auth-token', authToken)
      if (partnerUserId) wrapper.setAttribute('data-fundbox-partner-user-id', partnerUserId)
      if (fbxForce === 'react' || fbxForce === 'legacy') {
        wrapper.setAttribute('data-fundbox-fbx-force', fbxForce)
      }

      document.getElementById('meta').innerHTML =
        'Fuse partner <strong>' +
        param('name', DEFAULTS.partnerName) +
        '</strong> (<code>' +
        partnerId +
        '</code>) · embed <code>' +
        embedHost +
        '</code> · fuse.js from <code>' +
        fuseScriptOrigin +
        '</code> · parent <code>' +
        window.location.origin +
        window.location.pathname +
        '</code>'

      function onFuseAPIReady() {
        window.FbxFuseClient = new FbxFuse(partnerId, {
          container: wrapper,
          events: {
            onStateReady: function (e) {
              console.log('Fundbox State Ready', e)
              window.FbxFuseClient.open({})
            },
            onStateChange: function (e) {
              console.log('Fundbox State Changed', e)
            },
          },
        })
      }

      var fuseScript = document.createElement('script')
      fuseScript.src =
        fuseScriptOrigin +
        '/static/dist/fuse/v1/fuse.js?domain=' +
        encodeURIComponent(embedHost)
      fuseScript.onerror = function () {
        console.error('[fuse-testing] Failed to load fuse.js from', fuseScript.src)
      }
      document.body.appendChild(fuseScript)
    </script>
  </body>
</html>
