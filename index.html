<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fuse partner — GitHub Pages host</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow: hidden;
      }
      .meta {
        flex-shrink: 0;
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }
      .meta code {
        font-size: 0.75rem;
      }
      .toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #eee;
      }
      .toolbar button {
        font: inherit;
        padding: 0.4rem 0.75rem;
        cursor: pointer;
      }
      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 16px;
      }
      #fundbox-app-wrapper {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        height: 100%;
        border: 1px solid #ccc;
        overflow: hidden;
      }
      #fundbox-app-wrapper > iframe#fundbox-fuse-app {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border: 0;
      }
    </style>
  </head>
  <body>
    <p class="meta" id="meta"></p>
    <div class="toolbar">
      <button type="button" id="open-fuse">Open Fuse</button>
      <span>Fuse fills the panel below (container / JS API).</span>
    </div>
    <div class="dashboard">
      <div
        id="fundbox-app-wrapper"
        data-fundbox-id="WCAQEWAT6K"
        data-fundbox-partner-user-id=""
      ></div>
    </div>

    <script>
      /**
       * n-testing RDE — full-height container embed (JS API).
       * fuse.js from app-n-testing (no ?domain= on n-testing — avoids signup redirect on GitHub Pages).
       */
      var DEFAULT_PARTNER_ID = 'WCAQEWAT6K'
      var DEFAULT_PARTNER_NAME = 'franpos'
      var EMBED_HOST = 'n-testing.fbx.im'
      var FUSE_SCRIPT_ORIGIN = 'https://app-n-testing.fbx.im'

      function param(name, fallback) {
        var q = new URLSearchParams(window.location.search)
        var v = q.get(name)
        return v != null && String(v).trim() !== '' ? String(v).trim() : fallback
      }

      var wrapper = document.querySelector('#fundbox-app-wrapper')
      var partnerId = param('fuse_partner_id', param('partnerId', DEFAULT_PARTNER_ID))
      wrapper.setAttribute('data-fundbox-id', partnerId)

      var authToken = param('auth_token', '')
      if (authToken) wrapper.setAttribute('data-fundbox-auth-token', authToken)

      var partnerUserId = param('partner_user_id', param('partnerUserId', ''))
      wrapper.setAttribute('data-fundbox-partner-user-id', partnerUserId)

      var fbxForce = param('fbxForce', param('fbx_force', ''))
      if (fbxForce === 'react' || fbxForce === 'legacy') {
        wrapper.setAttribute('data-fundbox-fbx-force', fbxForce)
      }

      document.getElementById('meta').innerHTML =
        'Fuse partner <strong>' +
        param('name', DEFAULT_PARTNER_NAME) +
        '</strong> (<code>' +
        partnerId +
        '</code>) · container JS API · embed <code>' +
        EMBED_HOST +
        '</code> · fuse.js from <code>' +
        FUSE_SCRIPT_ORIGIN +
        '</code> · parent <code>' +
        window.location.origin +
        window.location.pathname +
        '</code>'

      function openFusePanel() {
        if (window.FbxFuseClient) {
          window.FbxFuseClient.open({})
        }
      }

      document.getElementById('open-fuse').addEventListener('click', openFusePanel)

      function onFuseAPIReady() {
        window.FbxFuseClient = new FbxFuse(partnerId, {
          container: wrapper,
          events: {
            onStateReady: function (e) {
              console.log('Fundbox State Ready', e)
              openFusePanel()
            },
            onStateChange: function (e) {
              console.log('Fundbox State Changed', e)
            },
          },
        })
      }
    </script>
    <script src="https://app-n-testing.fbx.im/static/dist/fuse/v1/fuse.js"></script>
  </body>
</html>
