<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fuse partner — GitHub Pages host</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .meta {
        flex-shrink: 0;
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }
      .meta code {
        font-size: 0.75rem;
      }
      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #fundbox-app-wrapper {
        border: 1px solid gray;
        margin: 16px;
        width: calc(100% - 32px);
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <p class="meta" id="meta"></p>
    <div class="dashboard">
      <div id="fundbox-app-wrapper"></div>
    </div>

    <script>
      /**
       * Fuse partner test page (GitHub Pages or Live Server).
       *
       * Research RDE uses two hostnames:
       *   app-n-research.fbx.im — static fuse.js (/static/dist/fuse/v1/fuse.js)
       *   n-research.fbx.im     — fuse_app iframe target (?domain=…)
       *
       * Query params:
       *   stack=react-local | rde | rde-react
       *     (default: rde)
       *     rde-react = same as rde&fbxForce=react
       *   host / domain             fuse.js ?domain= embed host (default n-research.fbx.im)
       *   reactDomain / reactPort   React shell host (stack=react-local only)
       *   fuseScriptOrigin          Where fuse.js is loaded from (default app-n-research on rde)
       *   fbxForce=react|legacy     Ask the edge router for React vs legacy
       *   fuse_partner_id, auth_token, partner_user_id, name — partner context
       *
       * Local React stack: frontend-react/docs/FUSE_LEGACY_LOCAL_DEV.md
       */
      var DEFAULTS = {
        partnerId: '2UPE4IM4Q5',
        appHost: 'n-research.fbx.im',
        partnerName: 'franpos',
        reactAppDomain: 'localhost:3000',
        fuseScriptOriginLocal: 'https://app-local.fbx.im:4505',
        fuseScriptOriginRde: 'https://app-n-research.fbx.im',
      }

      function param(name, fallback) {
        var q = new URLSearchParams(window.location.search)
        var v = q.get(name)
        return v != null && String(v).trim() !== '' ? String(v).trim() : fallback
      }

      function normalizeAppHost(raw) {
        return String(raw || '')
          .trim()
          .replace(/^https?:\/\//i, '')
          .replace(/\/+$/, '')
      }

      function ensureHttpsOrigin(raw) {
        var trimmed = String(raw || '').trim().replace(/\/+$/, '')
        if (/^https?:\/\//i.test(trimmed)) return trimmed
        return 'https://' + normalizeAppHost(trimmed)
      }

      function readReactAppDomain() {
        var fromDomain = param('reactDomain', '')
        if (fromDomain) return normalizeAppHost(fromDomain)
        var fromPort = param('reactPort', '')
        if (fromPort) return 'localhost:' + fromPort
        return DEFAULTS.reactAppDomain
      }

      var stack = param('stack', 'rde')
      var partnerId = param('fuse_partner_id', param('partnerId', DEFAULTS.partnerId))
      var appHost = normalizeAppHost(param('host', param('domain', DEFAULTS.appHost)))
      var authToken = param('auth_token', '')
      var partnerUserId = param('partner_user_id', param('partnerUserId', ''))
      var fbxForce = param('fbxForce', param('fbx_force', ''))
      if (stack === 'rde-react') {
        stack = 'rde'
        if (fbxForce !== 'react' && fbxForce !== 'legacy') {
          fbxForce = 'react'
        }
      }

      var wrapper = document.querySelector('#fundbox-app-wrapper')
      wrapper.setAttribute('data-fundbox-id', partnerId)
      if (authToken) wrapper.setAttribute('data-fundbox-auth-token', authToken)
      if (partnerUserId) wrapper.setAttribute('data-fundbox-partner-user-id', partnerUserId)
      if (fbxForce === 'react' || fbxForce === 'legacy') {
        wrapper.setAttribute('data-fundbox-fbx-force', fbxForce)
      }

      var fuseScriptDomain
      var fuseScriptOrigin
      if (stack === 'react-local') {
        fuseScriptDomain = readReactAppDomain()
        fuseScriptOrigin = ensureHttpsOrigin(
          param('fuseScriptOrigin', DEFAULTS.fuseScriptOriginLocal),
        )
      } else {
        fuseScriptDomain = appHost
        fuseScriptOrigin = ensureHttpsOrigin(
          param('fuseScriptOrigin', DEFAULTS.fuseScriptOriginRde),
        )
      }

      document.getElementById('meta').innerHTML =
        'Fuse partner <strong>' +
        param('name', DEFAULTS.partnerName) +
        '</strong> (<code>' +
        partnerId +
        '</code>) · stack <code>' +
        stack +
        '</code> · embed <code>' +
        fuseScriptDomain +
        '</code> · fuse.js from <code>' +
        fuseScriptOrigin +
        '</code> · parent <code>' +
        window.location.origin +
        window.location.pathname +
        '</code>'

      function onFuseAPIReady() {
        window.FbxFuseClient = new FbxFuse(partnerId, {
          container: wrapper,
          events: {
            onStateReady: function (e) {
              console.log('Fundbox State Ready', e)
              window.FbxFuseClient.open({})
            },
            onStateChange: function (e) {
              console.log('Fundbox State Changed', e)
            },
          },
        })
      }

      var fuseScript = document.createElement('script')
      fuseScript.src =
        fuseScriptOrigin +
        '/static/dist/fuse/v1/fuse.js?domain=' +
        encodeURIComponent(fuseScriptDomain)
      fuseScript.onerror = function () {
        console.error(
          '[fuse-testing] Failed to load fuse.js from',
          fuseScript.src,
          stack === 'react-local'
            ? '— run `npm run dev:fuse` in frontend/ and `yarn dev:fundbox` in frontend-react/'
            : '',
        )
      }
      document.body.appendChild(fuseScript)
    </script>
  </body>
</html>
