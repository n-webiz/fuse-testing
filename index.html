<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fuse partner — GitHub Pages host</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .meta {
        flex-shrink: 0;
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }
      .meta code {
        font-size: 0.75rem;
      }
      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 16px;
        box-sizing: border-box;
      }
      /* fuse.js defaults the widget iframe to 200×60; stretch for full-page test host */
      #fundbox-fuse-button {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
      }
      #fundbox-fuse-button iframe#fundbox-fuse-button-iframe {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border: 0;
      }
      .hint {
        flex-shrink: 0;
        margin: 0;
        padding: 0.5rem 1rem 0;
        font-size: 0.875rem;
        color: #444;
      }
    </style>
  </head>
  <body>
    <p class="meta" id="meta"></p>
    <p class="hint">Fundbox widget below (full size). Click it to open the Fuse overlay.</p>
    <div class="dashboard">
      <div
        id="fundbox-fuse-button"
        data-fundbox-id="WCAQEWAT6K"
      ></div>
    </div>

    <script>
      /**
       * Fuse partner test page (GitHub Pages or Live Server) — n-testing RDE, button API.
       *
       *   app-n-webiz.fbx.im/static/dist/fuse/v1/fuse.js
       *   (no ?domain= — app-n-webiz.fbx.im /fuse/v1/* redirects to signup and breaks GitHub Pages embeds)
       *
       * Previously (commented out):
       *   app-n-testing.fbx.im/static/dist/fuse/v1/fuse.js
       *   (no ?domain= — n-testing.fbx.im /fuse/v1/* redirects to signup and breaks GitHub Pages embeds)
       *
       * Mount #fundbox-fuse-button; fuse.js injects the widget iframe and full-page fuse_app
       * overlay when the user clicks the button.
       *
       * Query params (optional): fuse_partner_id, auth_token, partner_user_id, name,
       * fbxForce=react|legacy
       */
      var DEFAULT_PARTNER_ID = 'WCAQEWAT6K'
      var DEFAULT_PARTNER_NAME = 'franpos'
      // var EMBED_HOST = 'n-testing.fbx.im'
      // var FUSE_SCRIPT_ORIGIN = 'https://app-n-testing.fbx.im'
      var EMBED_HOST = 'app-n-webiz-rde.fbx.im'
      var FUSE_SCRIPT_ORIGIN = 'https://app-n-webiz-rde.fbx.im'

      function param(name, fallback) {
        var q = new URLSearchParams(window.location.search)
        var v = q.get(name)
        return v != null && String(v).trim() !== '' ? String(v).trim() : fallback
      }

      var fuseButton = document.querySelector('#fundbox-fuse-button')
      var partnerId = param('fuse_partner_id', param('partnerId', DEFAULT_PARTNER_ID))
      fuseButton.setAttribute('data-fundbox-id', partnerId)

      var authToken = param('auth_token', '')
      if (authToken) fuseButton.setAttribute('data-fundbox-auth-token', authToken)

      var partnerUserId = param('partner_user_id', param('partnerUserId', ''))
      if (partnerUserId) fuseButton.setAttribute('data-fundbox-partner-user-id', partnerUserId)

      var fbxForce = param('fbxForce', param('fbx_force', ''))
      if (fbxForce === 'react' || fbxForce === 'legacy') {
        fuseButton.setAttribute('data-fundbox-fbx-force', fbxForce)
      }

      document.getElementById('meta').innerHTML =
        'Fuse partner <strong>' +
        param('name', DEFAULT_PARTNER_NAME) +
        '</strong> (<code>' +
        partnerId +
        '</code>) · button API · embed <code>' +
        EMBED_HOST +
        '</code> · fuse.js from <code>' +
        FUSE_SCRIPT_ORIGIN +
        '</code> · parent <code>' +
        window.location.origin +
        window.location.pathname +
        '</code>'
    </script>
    <!-- <script src="https://app-n-testing.fbx.im/static/dist/fuse/v1/fuse.js"></script> -->
    <script src="https://app-n-webiz-rde.fbx.im/static/dist/fuse/v1/fuse.js"></script>
  </body>
</html>
